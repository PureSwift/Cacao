name: Swift

on:
  push:
    branches: [develop, master]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # Swift 6.4 ships with the latest Xcode; the default may be older.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Swift version
        run: swift --version
      - name: Install dependencies
        run: brew install sdl3 cairo fontconfig
      - name: Build
        run: swift build
      - name: Test
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: swift test
      - name: Demo screenshot
        env:
          SDL_VIDEO_DRIVER: offscreen
          CACAO_SCREENSHOT: demo-linux.png
        run: swift run CacaoDemo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-linux
          path: demo-linux.png

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    env:
      SDL_VERSION: release-3.4.8
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config git libcairo2-dev libfontconfig-dev \
            libfreetype-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev \
            libgbm-dev libegl-dev libgl-dev libgles-dev libvulkan-dev \
            libdbus-1-dev libudev-dev libpulse-dev libasound2-dev \
            fonts-dejavu-core
      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-noble
      - name: Build SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_VERSION" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/sdl3 -DSDL_TESTS=OFF
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build
      - name: Configure SDL3 paths
        run: |
          echo "PKG_CONFIG_PATH=/opt/sdl3/lib/pkgconfig:/opt/sdl3/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/sdl3/lib:/opt/sdl3/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - name: Build
        run: swift build
      - name: Test
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: swift test
